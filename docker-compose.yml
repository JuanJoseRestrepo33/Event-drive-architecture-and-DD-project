# Entrega 4 — POC Hogar de los Alpes
# 4 microservicios + Apache Pulsar (broker de comandos y eventos)
services:
  broker:
    image: apachepulsar/pulsar:3.2.4
    command: bin/pulsar standalone
    ports: ["6650:6650", "8080:8080"]
    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 12

  cotizaciones:
    build: ./servicios/cotizaciones
    depends_on:
      broker: { condition: service_healthy }
    environment: { BROKER: pulsar, BROKER_HOST: broker }
    ports: ["5001:5001"]

  pagos:
    build: ./servicios/pagos
    depends_on:
      broker: { condition: service_healthy }
    environment: { BROKER: pulsar, BROKER_HOST: broker }
    ports: ["5002:5002"]

  notificaciones:
    build: ./servicios/notificaciones
    depends_on:
      broker: { condition: service_healthy }
    environment: { BROKER: pulsar, BROKER_HOST: broker }
    ports: ["5003:5003"]

  trabajos:
    build: ./servicios/trabajos
    depends_on:
      broker: { condition: service_healthy }
    environment: { BROKER: pulsar, BROKER_HOST: broker }
    ports: ["5004:5004"]

  # Cliente de escenarios (no arranca con `up`; se invoca con `docker compose run`)
  escenarios:
    build: { context: ., dockerfile: escenarios/Dockerfile }
    profiles: ["escenarios"]
    depends_on:
      broker: { condition: service_healthy }
    volumes: ["./escenarios/estado:/estado"]
